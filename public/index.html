<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
<title>Notes</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<aside id="sidebar">
  <div class="sidebar-header">
    <span>Notes</span>
    <div class="sidebar-actions">
      <button id="new-note" title="New note">+ Note</button>
      <button id="show-shortcuts" title="Keyboard shortcuts (?)">?</button>
    </div>
  </div>
  <div id="tree"></div>
</aside>
<!-- On a narrow screen the sidebar is a drawer over the note; this is what
     closes it when tapped. Hidden on wide screens, see style.css. -->
<div id="sidebar-backdrop"></div>
<main id="editor-wrap">
  <!-- Only shown on narrow screens, where the sidebar is not. -->
  <header id="topbar">
    <button id="open-sidebar" type="button" title="Notes" aria-label="Show notes">☰</button>
    <span id="topbar-title">Notes</span>
    <button id="topbar-new-note" type="button" title="New note" aria-label="New note">＋</button>
  </header>
  <div id="editor"></div>
  <div id="empty-state">Select a note or create a new one.</div>
</main>
<!-- A native <dialog>, so Escape, the backdrop and the focus trap are free.
     The rows are built in app.js from the table of shortcuts it keeps. -->
<dialog id="shortcuts" class="modal">
  <div class="dialog-header">
    <h2>Keyboard shortcuts</h2>
    <button id="close-shortcuts" title="Close">×</button>
  </div>
  <div id="shortcuts-body" tabindex="-1" autofocus></div>
</dialog>
<!-- "New note in…" and "Move to…" both come out here. The list of matches, and
     the "Create …" row for a path that does not exist yet, are path-prompt.js. -->
<dialog id="path-prompt" class="modal">
  <div class="dialog-header">
    <h2 id="path-prompt-title"></h2>
    <button id="path-prompt-close" title="Close">×</button>
  </div>
  <div class="picker-body">
    <input id="path-prompt-input" class="picker-input" type="text" placeholder="journal/2026"
           autocomplete="off" autocorrect="off" spellcheck="false" autofocus />
    <div id="path-prompt-error" class="picker-error"></div>
    <div id="path-prompt-list" class="picker-list"></div>
    <div class="picker-hint">
      Folders are created as you name them. <kbd>Tab</kbd> completes, <kbd>Enter</kbd> confirms.
    </div>
  </div>
</dialog>
<!-- The note switcher (Mod-Alt-O). Same picker, over notes — see note-prompt.js. -->
<dialog id="note-prompt" class="modal">
  <div class="dialog-header">
    <h2>Switch to…</h2>
    <button id="note-prompt-close" title="Close">×</button>
  </div>
  <div class="picker-body">
    <input id="note-prompt-input" class="picker-input" type="text" placeholder="Note name or folder"
           autocomplete="off" autocorrect="off" spellcheck="false" autofocus />
    <div id="note-prompt-error" class="picker-error"></div>
    <div id="note-prompt-list" class="picker-list"></div>
  </div>
</dialog>
<!-- The editor is an ES module, split so a code block's language is fetched
     only when a note has one. Module and deferred scripts run in document
     order once parsing is done, so app.js still finds NotesEditor ready. -->
<script type="module" src="/editor/editor.js"></script>
<script defer src="/path-prompt.js"></script>
<script defer src="/note-prompt.js"></script>
<script defer src="/app.js"></script>
</body>
</html>
